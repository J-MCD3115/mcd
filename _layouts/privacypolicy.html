<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="メタディスクリプション" />

    <meta property="og:url" content="https://asahi-jinz.github.io/asahi/" />
    <meta property="og:title" content="MCD|秋田県" />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="メタディスクリプション" />
    <meta
      property="og:image"
      content="{{ '../img/fabkn.png' | relative_url }}"
    />
    <meta property="og:site_name" content="MCD" />
    <meta property="og:locale" content="ja_JP" />

    <link
      rel="icon"
      href="{{ '../img/fabkn.png' | relative_url }}"
      sizes="16x16"
      type="image/png"
    />
    <link
      rel="icon"
      href="{{ '../img/fabkn.png' | relative_url }}"
      sizes="32x32"
      type="image/png"
    />
    <link
      rel="icon"
      href="{{ '../img/fabkn.png' | relative_url }}"
      sizes="48x48"
      type="image/png"
    />
    <link
      rel="icon"
      href="{{ '../img/fabkn.png' | relative_url }}"
      sizes="62x62"
      type="image/png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Antique&family=Zen+Kaku+Gothic+New&display=swap"
      rel="stylesheet"
    />
    <title>MCD|秋田県</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>

    <link rel="stylesheet" href="{{ '../css/style.css' | relative_url }}" />
    <script src="{{ '../js/jquery-4.0.0.min.js' | relative_url }}"></script>
    <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
    <script src="{{ '../js/script.js' | relative_url }}"></script>
  </head>

  <body class="policy-page">
    <div class="loading">
      <div class="loadingInr">
        <img src="../img/MCD_Logo.png" alt="MCD" />
      </div>
      <div class="spinner"></div>
    </div>

    {% include header.html %}

    <div id="">
      <div class="contents">{{ content }}</div>

      {% include footer.html %}
    </div>
  </body>
</html>
